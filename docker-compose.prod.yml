
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_DATABASE:-guide_badges}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the backend (same Docker network) talks to the DB

  backend:
    image: thanosmourtk/korifes-backend:26.11.25-beta
    restart: always
    # The frontend's nginx proxies /api to the backend over the Docker network;
    # only expose it on localhost (for debugging / a host-level reverse proxy)
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_DATABASE: ${DB_DATABASE:-guide_badges}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      PORT: 3000
    depends_on:
      - db
    volumes:
      - ./uploads:/usr/src/app/uploads

  frontend:
    image: thanosmourtk/korifes-frontend:26.11.25-beta
    restart: always
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_ENV: ${VITE_ENV:-production}
      VITE_STAGING_MESSAGE: ${VITE_STAGING_MESSAGE:-}
    depends_on:
      - backend

volumes:
  postgres_data:
