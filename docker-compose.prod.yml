# Production stack: runs the images published by ./release.sh. Nothing is built
# on the server; only this file and .env.production are needed there.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_DATABASE:-guide_badges}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the backend (same Docker network) talks to the DB

  # Γράφει το garage.toml στο volume garage_config και τελειώνει, ώστε στον
  # server να μη χρειάζεται αρχείο ρυθμίσεων δίπλα στο compose. Τα secrets
  # (rpc_secret, admin_token) δεν μπαίνουν εδώ· το Garage τα παίρνει από env.
  garage-config:
    image: busybox:1.37
    restart: "no"
    logging: *logging
    command:
      - sh
      - -c
      - |
        cat > /config/garage.toml <<'EOF'
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        db_engine = "sqlite"

        replication_factor = 1

        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "127.0.0.1:3901"

        [s3_api]
        s3_region = "garage"
        api_bind_addr = "[::]:3900"

        [admin]
        api_bind_addr = "[::]:3903"
        EOF
    volumes:
      - garage_config:/config

  # Αποθήκευση ανεβασμένων αρχείων (S3). Χωρίς δημοσιευμένη θύρα.
  garage:
    image: dxflrs/garage:v2.4.1
    restart: always
    logging: *logging
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}
    depends_on:
      garage-config:
        condition: service_completed_successfully
    volumes:
      - garage_config:/etc/garage:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

  # Στήνει layout, bucket και κλειδί στο Garage και τελειώνει (idempotent)
  garage-init:
    image: ghcr.io/athamour1/koryfes/backend:${TAG:-latest}
    restart: "no"
    logging: *logging
    command: ["node", "dist/src/storage/garage-init.js"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN must be set}
      S3_BUCKET: ${S3_BUCKET:-koryfes}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
    depends_on:
      - garage

  backend:
    image: ghcr.io/athamour1/koryfes/backend:${TAG:-latest}
    restart: always
    logging: *logging
    # No published port: the frontend's nginx proxies /api to it over the
    # Docker network (the image has its own /health HEALTHCHECK)
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_DATABASE: ${DB_DATABASE:-guide_badges}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      PORT: 3000
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-koryfes}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
    depends_on:
      db:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    volumes:
      # παλιά τοπικά αρχεία: μεταφέρονται στο Garage στην εκκίνηση
      - ./uploads:/usr/src/app/uploads

  frontend:
    image: ghcr.io/athamour1/koryfes/frontend:${TAG:-latest}
    restart: always
    logging: *logging
    # Only this port is published; put a TLS reverse proxy in front of it
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_ENV: ${VITE_ENV:-production}
      VITE_STAGING_MESSAGE: ${VITE_STAGING_MESSAGE:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  garage_config:
  garage_meta:
  garage_data:
